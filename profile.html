<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title, description and icon are written by study.meta.ts from src/study.json. -->
    <meta name="color-scheme" content="light dark" />
    <!-- The Display setting (Settings, Account preferences, Dark mode), applied before the first paint. -->
    <script>try{var t=JSON.parse(localStorage.getItem("gg19p-settings")||"{}").theme;if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/profile.tsx"></script>
  </body>
</html>
